# Builds the two deployment images whenever something that shapes them changes, so a Dependabot
# base-image bump (or a Dockerfile edit) is proven to build before it merges. ci.yml runs Maven
# only and never builds an image (Java4Shell plan, WI-2). It pushes nothing. It also proves the
# egress allowlist (ADR-029).
#
# No schedule yet: a weekly --pull rebuild only pays off once a rebuilt image is deployed. Add one
# with the production rebuild-and-redeploy job. Never switch a trigger to pull_request_target.
name: image
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - 'compose*.yaml'
      - 'deploy/egress-proxy/**'
      - .github/workflows/image.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - 'compose*.yaml'
      - 'deploy/egress-proxy/**'
      - .github/workflows/image.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Production needs real hosts and tokens to interpolate, so it is checked for structure only.
      - name: Check the compose files
        run: |
          docker compose config -q
          docker compose -f compose.yaml -f compose.production.yaml config -q --no-interpolate
      - name: Build db-init
        run: docker build --pull --target db-init -t naturalist-db-init:ci .
      - name: Build app
        run: docker build --pull --target app -t naturalist-app:ci .
      - name: Report the runtime JDK
        run: docker run --rm --entrypoint java naturalist-app:ci -version
      # The allowlist proxy alone, probed from the app image on the internal network (ADR-029):
      # listed hosts tunnel, everything else is refused, and there is no direct route or DNS out.
      - name: Check the egress allowlist
        run: |
          docker compose up -d --wait egress-proxy
          docker run --rm -i --network naturalist_internal --entrypoint bash naturalist-app:ci -s \
            < deploy/egress-proxy/probe.sh
      - name: Show the egress proxy log
        if: always()
        run: docker compose logs egress-proxy
