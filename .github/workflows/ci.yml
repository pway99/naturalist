name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: naturalist_test
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      NATURALIST_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/naturalist_test
      NATURALIST_TEST_DB_USER: postgres
      NATURALIST_TEST_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test the alert rules
        run: >-
          docker run --rm -v "$PWD/deploy/prometheus:/rules:ro" -w /rules --entrypoint promtool
          prom/prometheus:v3.13.5 test rules alerts.test.yml
      # java-version '25' resolves to the newest Temurin 25 GA (25.0.5.1+2, the CVE-2026-114938 fix,
      # since 2026-11-18). The deployed runtime is pinned separately, in the Dockerfile.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '25' }
      - run: mvn -q -DskipTests install
      - run: java -jar apps/test-db-seeder/target/test-db-seeder-1.0.0-SNAPSHOT-jar-with-dependencies.jar
      - run: mvn -q verify
