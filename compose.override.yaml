# Local differences only, loaded automatically by `docker compose up`. Never use this file in
# production: the log-only challenge lets every bot through, and it publishes a port.

services:
  app:
    environment:
      # Real challenge verification needs the vendor's widget, which needs the real hostname.
      NATURALIST_CHALLENGE_LOG_ONLY: "true"
      # Mail is delivered to Mailpit, at http://localhost:8025, and goes no further.
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mailpit:
        condition: service_started

  db:
    ports:
      # 5433 so it never collides with the standing test database on 5432.
      - "127.0.0.1:5433:5432"

  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
