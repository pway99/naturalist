# Local differences only, loaded automatically by `docker compose up`. Never use this file in
# production: the log-only challenge lets every bot through, and it publishes a port.

services:
  app:
    environment:
      # Real challenge verification needs the vendor's widget, which needs the real hostname.
      NATURALIST_CHALLENGE_LOG_ONLY: "true"
      # Mail is delivered to Mailpit, at http://localhost:8025, and goes no further.
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
    ports:
      - "127.0.0.1:8080:8080"
    # Docker publishes no port for a container on an internal network alone, so locally the app and
    # the database also join default. HTTPS still goes through egress-proxy (JAVA_OPTS); only the
    # no-route-out half of ADR-029 is production-only. check.sh says which checks that affects.
    networks: [internal, default]
    depends_on:
      mailpit:
        condition: service_started

  db:
    ports:
      # 5433 so it never collides with the standing test database on 5432.
      - "127.0.0.1:5433:5432"
    networks: [internal, default]

  prometheus:
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    command:
      - --config.file=/etc/alertmanager/config/local.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    depends_on:
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.34
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    # internal for the app's mail, default for Alertmanager's and the published UI.
    networks: [internal, default]
