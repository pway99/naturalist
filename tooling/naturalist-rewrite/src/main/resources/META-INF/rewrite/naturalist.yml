type: specs.openrewrite.org/v1beta/recipe
name: com.naturalist.EnforceArchitecture
displayName: Naturalist architectural enforcement
description: >-
  Enforces the ADR-001 test-data-graph invariants: acquire TestEntitySources via
  NaturalistDatabase#getNamed, obtain the test database from a @RegisterExtension
  NaturalistTestExtension, and never cache a TestEntitySource in a field; and the ADR-028
  secrets rules: never read the process environment outside com.naturalist.secrets, and
  never name a credential in source. Every concrete named value declares the factory
  NamedValues reads it through, and declares no @JsonCreator of its own. No source declares
  a variable with var, and every import is explicit. Every observation names the method it runs in.
recipeList:
  - com.naturalist.rewrite.NoDirectTestEntitySourceConstruction
  - com.naturalist.rewrite.NoCachedTestEntitySourceField
  - com.naturalist.rewrite.AcquireDatabaseViaExtension
  - com.naturalist.rewrite.NoSystemGetenv
  - com.naturalist.rewrite.NoNamedCredentials
  - com.naturalist.rewrite.NamedValueHasFactory
  - com.naturalist.rewrite.NoSubtypeJsonCreator
  - com.naturalist.rewrite.NoVar
  - com.naturalist.rewrite.ObserverMethodName
  - org.openrewrite.java.RemoveUnusedImports
  - com.naturalist.EnforceQueryHygiene
---
type: specs.openrewrite.org/v1beta/recipe
name: com.naturalist.EnforceQueryHygiene
displayName: Naturalist query-hygiene enforcement
description: >-
  Fails the build on an N+1 fan-out: a repository or query select invoked inside a loop or a
  per-element stream operation. The lexical, same-method backstop to the runtime select-count
  gate; call the batched sibling once instead.
recipeList:
  - com.naturalist.rewrite.NoSelectInIteration
---
type: specs.openrewrite.org/v1beta/recipe
name: com.naturalist.NamedValueEdges
displayName: Naturalist named-value edges (report-only)
description: >-
  Marks a Spring handler parameter that should take a named value's type instead of String, and
  an id or numeric named-value handler parameter that is still required. Report-only while the
  controllers are converted one per diff; it joins EnforceArchitecture with the last one
  (docs/plans/2026-11-18-named-value-serialization-design.md, step 3).
recipeList:
  - com.naturalist.rewrite.TypedPathVariable
---
type: specs.openrewrite.org/v1beta/style
name: com.naturalist.Style
displayName: Naturalist code style
description: >-
  Imports are explicit, never folded into a star import: the import block is the quickest record
  of the types and packages a class uses. OpenRewrite has no switch for that, only the counts at
  which it folds, so both are set out of reach. The layout, IntelliJ's default, places the imports
  a recipe adds.
styleConfigs:
  - org.openrewrite.java.style.ImportLayoutStyle:
      classCountToUseStarImport: 2147483647
      nameCountToUseStarImport: 2147483647
      layout:
        - import all other imports
        - <blank line>
        - import javax.*
        - import java.*
        - <blank line>
        - import static all other imports
