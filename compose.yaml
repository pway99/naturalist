# The deployment, as it runs in production. No service publishes a port: the only way in is
# cloudflared, and a published port would reach the app from the Docker gateway, an address Tomcat
# trusts for forwarded headers (apps/CLAUDE.md, "Client identity behind a proxy").
#
#   Local:      docker compose up --build            (also loads compose.override.yaml)
#   Production: docker compose -f compose.yaml -f compose.production.yaml up -d
#
# First run: deploy/create-secrets.sh, and see docs/runbooks/local-stack.md.
#
# Outbound access (ADR-029): app, db and db-init sit on `internal` alone, which has no route out
# and resolves container names only. The app reaches the outside through egress-proxy, which allows
# a short list of hosts. Prove it with deploy/egress-proxy/check.sh.

name: naturalist

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: naturalist
      POSTGRES_USER: naturalist
      POSTGRES_PASSWORD_FILE: /run/secrets/database-credential
    secrets:
      - database-credential
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naturalist -d naturalist"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    networks: [internal]

  # One-shot. Safe on every start: see DeploymentDbInitializer.
  db-init:
    image: naturalist-db-init:${NATURALIST_VERSION:-local}
    build:
      context: .
      target: db-init
    environment:
      JAVA_OPTS: >-
        -Dnaturalist.db.url=jdbc:postgresql://db:5432/naturalist
        -Dnaturalist.db.username=naturalist
        -Dnaturalist.secrets.directory=/run/secrets
        -Dnaturalist.images.root=/data/images
    secrets:
      - database-credential
    volumes:
      - images:/data/images
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  app:
    image: naturalist-app:${NATURALIST_VERSION:-local}
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      # Every HTTPS call (the model API, the challenge check) goes through the allowlist proxy.
      JAVA_OPTS: -Dhttps.proxyHost=egress-proxy -Dhttps.proxyPort=3128
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/app/
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/naturalist
      SPRING_DATASOURCE_USERNAME: naturalist
      NATURALIST_ADMIN_USERNAME: ${NATURALIST_ADMIN_USERNAME:-admin}
      NATURALIST_VISION_PROVIDER: ${NATURALIST_VISION_PROVIDER:-none}
      NATURALIST_SECRETS_SOURCE: file
      NATURALIST_SECRETS_DIRECTORY: /run/secrets
      # The file systems the storage alerts watch (deploy/prometheus/alerts.yml): photos and the
      # database. Logs and Prometheus's data sit on the same host disk as these volumes.
      MANAGEMENT_METRICS_SYSTEM_DISKSPACE_PATHS: /data/images,/data/database
    secrets:
      - source: database-credential
        target: app/spring.datasource.password
      - source: admin-credential
        target: app/naturalist.admin.password
    volumes:
      - images:/data/images
      # Mounted only so the app can report the database volume's free space. Read-only, and
      # Postgres keeps the files in it readable by its own user alone.
      - db-data:/data/database:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1536m
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      egress-proxy:
        condition: service_healthy

  # The app's only way out: CONNECT tunnels to the hosts in deploy/egress-proxy/squid.conf.template,
  # nothing else (ADR-029). On both networks, so it is the one bridge between them. No port.
  egress-proxy:
    image: ubuntu/squid:6.6-24.04_edge@sha256:d9c34c5ab74c6dd41cf1070d9b4221aac072e67e983527ca2d41512958f77506
    restart: unless-stopped
    entrypoint: ["/etc/egress-proxy/start.sh"]
    volumes:
      - ./deploy/egress-proxy:/etc/egress-proxy:ro
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/spool/squid
      # Bounded: tmpfs pages count against mem_limit. squid.conf.template rotates every minute.
      - /var/log/squid:size=16m
    # A real request, so Squid answers it (403) and squid.conf.template keeps it out of the log.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3128 && printf 'GET http://healthcheck.invalid/ HTTP/1.0\\r\\n\\r\\n' >&3 && read -r -t 3 line <&3 && [[ $$line == HTTP/* ]]"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 128m
    networks: [internal, default]

  # Reads the app's management port over this private network. See deploy/prometheus.
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    # internal to scrape the app; default to reach Alertmanager.
    networks: [internal, default]
    depends_on:
      - alertmanager

  # Sends the alerts. Each overlay chooses where: compose.override.yaml or compose.production.yaml.
  alertmanager:
    image: prom/alertmanager:v0.35.0
    restart: unless-stopped
    volumes:
      - ./deploy/alertmanager:/etc/alertmanager/config:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 64m

networks:
  # No route out, and Docker's DNS answers container names only (Docker Engine 26 or later).
  internal:
    internal: true
  default: {}

volumes:
  db-data:
  images:
  prometheus-data:
  alertmanager-data:

secrets:
  database-credential:
    file: ./secrets/database-credential
  admin-credential:
    file: ./secrets/admin-credential
