spring:
  application:
    name: naturalist-console
  # No datasource stanza: app-level tests run on the in-memory @MockDomainService doubles.
  # Which persistence a test sees is decided by the classpath, in this module's POM — the
  # *-repository-rdbms jars are dropped from the test classpath by Surefire's
  # classpathDependencyExcludes, and the mocks arrive as the test-scoped spring-test-data jar.
  # There is no profile and no toggle here; see MockDataConfiguration.
  #
  # The one thing still worth saying out loud: with no datasource configured, Spring Boot would
  # otherwise try to *invent* one (Hikari is on the classpath transitively) and fail with
  # "Failed to determine a suitable driver class". Declining to fabricate a DataSource is not a
  # choice between implementations, so it belongs here rather than in the classpath.
  #
  # NOTE the package: Spring Boot 4 moved the JDBC auto-configuration out of the monolithic
  # spring-boot-autoconfigure jar into the spring-boot-jdbc module, renaming
  # org.springframework.boot.autoconfigure.jdbc.* to org.springframework.boot.jdbc.autoconfigure.*.
  # An exclude naming a class that is not on the classpath is silently ignored, so the stale
  # name did not error — it just stopped excluding, and every @SpringBootTest here died on
  # "Failed to determine a suitable driver class".
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

naturalist:
  admin:
    username: test-admin
    password: test-password
  usage:
    warning-percent: 80
    alert-email: test@example.com

gg:
  jte:
    development-mode: true
    template-suffix: .jte
