spring:
  application:
    name: naturalist-console
  # Naturalist persistence runs on the RDBMS adapter (Postgres + MyBatis). Points at
  # the standing local test database for now; production wiring is a later effort.
  datasource:
    url: jdbc:postgresql://localhost:5432/naturalist_test
    username: postgres
    password: postgres
  # Uncomment to enable outbound usage-alert email (task D1's AlertEmailer is a
  # no-op until a JavaMailSender bean exists — i.e. until this block is active).
  # mail:
  #   host: ${SMTP_HOST}
  #   port: ${SMTP_PORT:587}
  #   username: ${SMTP_USERNAME}
  #   password: ${SMTP_PASSWORD}
  #   properties:
  #     mail:
  #       smtp:
  #         auth: true
  #         starttls:
  #           enable: true

gg:
  jte:
    development-mode: true
    template-suffix: .jte

# DBO fields are camelCase; MyBatis translates snake_case columns across on read
# (mirrors MyBatisSupport's setMapUnderscoreToCamelCase(true)). Writes name columns explicitly.
mybatis:
  configuration:
    map-underscore-to-camel-case: true

naturalist:
  # naturalist.admin.username / naturalist.admin.password are REQUIRED and are deliberately
  # NOT declared here. Supply them at deploy time:
  #
  #   java -jar management-console.jar \
  #     --naturalist.admin.username=… --naturalist.admin.password=…
  #
  # Do not add them to this file, not even as ${ENV_VAR} placeholders. An unresolved
  # placeholder binds as the literal string "${ENV_VAR}", which is non-blank — so
  # AdminProperties accepts it and the app boots with a fixed, predictable credential pair
  # baked into the artifact. Verified: with the placeholders present the jar starts with no
  # credentials supplied; with the keys absent it aborts with
  # "naturalist.admin.username must be set and non-blank", which is the intended behaviour.
  usage:
    warning-percent: 80
    alert-email: patway99@gmail.com
  access:
    grant-policy: self-serve
  images:
    # Filesystem root of the image store: one <space>/ subdirectory per domain holds the
    # photos. Seed photos not found here fall back to the classpath.
    root: data/images
  email:
    # Envelope sender for outbound mail (verification / reset links, usage alerts).
    # Override per deployment once a real sending domain (with SPF/DKIM) is set up.
    from: no-reply@naturalist.local
    # The ONLY origin emailed links are built from — never the request's Host header, which an
    # attacker controls. Set to the deployment's real origin (https://…, no trailing slash);
    # the default makes a forgotten setting fail safe (dead links), not dangerous (their links).
    public-url: http://localhost:8080
    # naturalist.email.log-only is deliberately NOT set here. With no spring.mail.* block the
    # app REFUSES to boot unless --naturalist.email.log-only=true is passed explicitly: the
    # log-only sender prints every verification / reset token beside the recipient address,
    # which is fine on a developer's machine and an account-takeover primitive in a deployment.
