spring:
  application:
    name: naturalist-console
  # Naturalist persistence runs on the RDBMS adapter (Postgres + MyBatis). Points at
  # the standing local test database for now; production wiring is a later effort.
  datasource:
    url: jdbc:postgresql://localhost:5432/naturalist_test
    username: postgres
    password: postgres
  # Uncomment to enable outbound usage-alert email (task D1's AlertEmailer is a
  # no-op until a JavaMailSender bean exists — i.e. until this block is active).
  # mail:
  #   host: ${SMTP_HOST}
  #   port: ${SMTP_PORT:587}
  #   username: ${SMTP_USERNAME}
  #   password: ${SMTP_PASSWORD}
  #   properties:
  #     mail:
  #       smtp:
  #         auth: true
  #         starttls:
  #           enable: true

gg:
  jte:
    development-mode: true
    template-suffix: .jte

# DBO fields are snake_case and identical to their columns — auto-map straight across,
# never camelCase (mirrors MyBatisSupport's setMapUnderscoreToCamelCase(false)).
mybatis:
  configuration:
    map-underscore-to-camel-case: false

naturalist:
  usage:
    warning-percent: 80
    alert-email: patway99@gmail.com
