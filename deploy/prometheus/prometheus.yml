# Scrapes the app's private management port. Nothing here is reachable from the public site.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: naturalist
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8081"]
