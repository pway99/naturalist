# Local stack: every alert stops at Mailpit, at http://localhost:8025.
global:
  smtp_smarthost: mailpit:1025
  smtp_from: alerts@naturalist.local
  smtp_require_tls: false

route:
  receiver: mail
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - matchers: [severity="heartbeat"]
      receiver: nowhere

receivers:
  - name: mail
    email_configs:
      - to: operator@naturalist.local
        send_resolved: true
  - name: nowhere
